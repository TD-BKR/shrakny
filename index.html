<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syllabus & Course Management Portal v1.02</title>
    <!-- Old-school fonts for the ultimate retro operating system style -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Retro grid gaming background disguised with a slate grey workspace */
        body { 
            font-family: 'Courier Prime', monospace; 
            background-color: #55aaaa; /* Classic 90s Desktop Teal */
            background-image: linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            margin: 0; 
            padding: 0; 
            color: #000;
        }

        /* Windows 95 style header bar */
        .school-header {
            background-color: #c0c0c0;
            padding: 4px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #808080;
            box-shadow: inset 1px 1px 0px #fff;
        }
        .school-logo { font-weight: bold; font-size: 14px; font-family: sans-serif; color: #000; }
        .school-nav span { background: #d9d9d9; padding: 2px 8px; font-size: 12px; border: 1px solid #808080; margin-left: 5px; cursor: pointer; font-family: sans-serif;}

        .container { max-width: 650px; margin: 50px auto; padding: 10px; }
        
        /* The main app frame styled like a retro software window */
        .portal-card { 
            background: #c0c0c0; 
            padding: 4px;
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff; /* 3D bevel look */
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }

        /* Blue Windows Title Bar */
        .window-title-bar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: sans-serif;
        }
        .window-controls { background: #c0c0c0; color: black; padding: 1px 6px; border: 1px solid #808080; font-size: 10px; font-weight: bold; }

        .window-content {
            padding: 30px;
            background: #d9d9d9;
            border: 2px solid;
            border-color: #808080 #fff #fff #808080;
            margin-top: 4px;
        }

        h2 { color: #000; margin-top: 0; font-size: 20px; font-weight: bold; text-transform: uppercase; }
        p { color: #222; font-size: 13px; line-height: 1.5; font-weight: bold; }
        
        .input-group { margin: 25px 0; text-align: left; }
        label { display: block; font-size: 12px; font-weight: bold; color: #000; margin-bottom: 8px; }
        
        /* Retro input styling */
        input[type="text"] { 
            width: 100%; 
            padding: 10px; 
            border: 3px solid;
            border-color: #808080 #fff #fff #808080;
            font-size: 14px; 
            box-sizing: border-box;
            background-color: #fff;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
        }
        
        /* Beveled classic submit button */
        button { 
            width: 100%;
            padding: 12px; 
            background-color: #c0c0c0; 
            color: #000; 
            border: 3px solid;
            border-color: #fff #808080 #808080 #fff;
            cursor: pointer; 
            font-size: 15px; 
            font-weight: bold;
            font-family: 'Courier Prime', monospace;
        }
        button:active {
            border-color: #808080 #fff #fff #808080;
            padding: 13px 11px 11px 13px;
        }

        /* --- THE SLIDING RETRO ARCADE MARQUEE --- */
        .marquee-container {
            width: 100%;
            background-color: #000; /* Dark arcade cabinet space */
            padding: 12px 0;
            margin-top: 30px;
            border: 3px solid;
            border-color: #808080 #fff #fff #808080;
            overflow: hidden;
        }
        .sliding-mo {
            font-family: 'Press Start 2P', monospace; /* Heavy 8-bit text */
            font-size: 16px;
            color: #00ffff; /* Cyberpunk Neon Cyan */
            white-space: nowrap;
            display: inline-block;
            animation: bounceText 5s linear infinite alternate;
            text-shadow: 2px 2px 0px #ff00ff; /* Hot pink neon 3D accent */
        }

        @keyframes bounceText {
            0% { transform: translateX(5%); }
            100% { transform: translateX(65%); }
        }
    </style>
</head>
<body>

    <!-- OS Style Fake Header -->
    <div class="school-header">
        <div class="school-logo">📁 Academic_Network_Client.exe</div>
        <div class="school-nav">
            <span>File</span><span>Edit</span><span>Help</span>
        </div>
    </div>

    <div class="container">
        <!-- Main Windows 98 Box Frame -->
        <div class="portal-card">
            <div class="window-title-bar">
                <span>📚 Education Gateway Directory v1.02</span>
                <span class="window-controls">X</span>
            </div>
            
            <div class="window-content">
                <h2>System Research Archive</h2>
                <p>Establishing an active baseline data link. Enter your target destination pathway domain keywords into the command array line configuration interface below.</p>
                
                <div class="input-group">
                    <label>> TERMINAL_INPUT_PATHWAYS:</label>
                    <input type="text" id="targetUrl" placeholder="Type name (google) or web link...">
                </div>
                
                <button onclick="launchProxy()">[ RUN APPLICATION ]</button>

                <!-- Arcade signature marquee moving back and forth -->
                <div class="marquee-container">
                    <div class="sliding-mo">🎮 MO's SYSTEM 🎮</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function launchProxy() {
            let input = document.getElementById('targetUrl').value.trim();
            if (!input) { alert('ERROR: System requires a target data path.'); return; }
            
            let finalUrl = "";
            if (input.includes('.')) {
                if (!input.startsWith('http://') && !input.startsWith('https://')) {
                    finalUrl = 'https://' + input;
                } else {
                    finalUrl = input;
                }
            } else {
                finalUrl = 'https://google.com' + input;
            }
            
            // Encrypts text cleanly using the Base64 mask block engine
            let encryptedUrl = btoa(finalUrl);
            window.location.href = "https://corsproxy.io" + encryptedUrl;
        }
    </script>
</body>
</html>
