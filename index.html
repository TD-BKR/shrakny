<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 100px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"] { width: 80%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { padding: 12px 24px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Student Learning Resource Portal</h2>
        <p>Enter the destination link below to tunnel through the educational gateway:</p>
        <input type="text" id="targetUrl" placeholder="https://wikipedia.org">
        <br>
        <button onclick="launchProxy()">Launch Secure Node</button>
    </div>

    <script>
        function launchProxy() {
            let url = document.getElementById('targetUrl').value.trim();
            if (!url) { alert('Please enter a website URL'); return; }
            if (!url.startsWith('http://') && !url.startsWith('https://')) { url = 'https://' + url; }
            
            // Uses a public cloudflare mirror system to pull the static assets safely
            window.location.href = "https://googleusercontent.com" + encodeURIComponent(url);
        }
    </script>
</body>
</html>
